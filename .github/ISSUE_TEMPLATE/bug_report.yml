name: Bug report
description: Something in the CLI does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For a security problem, do not use this form:
        follow [SECURITY.md](https://github.com/devkauania/projeto-zero/blob/main/SECURITY.md#reporting-a-vulnerability)
        or open a [private contact request](https://github.com/devkauania/projeto-zero/issues/new?template=private_contact.yml),
        which asks for no details.
  - type: input
    id: version
    attributes:
      label: CLI version
      description: Output of `npx @projeto-zero/cli --version`, or the commit hash if you run from source.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Node.js version (`node --version`) and, for `swarm --live`, Claude Code version (`claude --version`).
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact commands you ran, starting from an empty directory if you can.
      render: shell
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Paste the full output. Remove anything private (paths, tokens) first.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
