name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  preflight:
    name: preflight (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      # Actions are pinned to full commit SHAs (tags can be moved).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run preflight gates
        run: node scripts/preflight.mjs

      - name: Verdict
        run: node scripts/verdict.mjs

      # Runner paths have no spaces, so this is the only place the whole gate
      # sees the kind of path a Windows user profile often has.
      - name: Preflight from a path with a space and an accent
        shell: bash
        run: |
          spaced="$RUNNER_TEMP/spaced path ação"
          mkdir -p "$spaced"
          git archive HEAD | tar -x -C "$spaced"
          cd "$spaced"
          npm ci
          node scripts/preflight.mjs
